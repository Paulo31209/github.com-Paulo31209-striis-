<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STRIIS — Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fbf6ec; --panel: #fff; --border: #ece0c9;
        --text: #3c3122; --dim: #90805f; --heading: #6b3d12;
        --brand: #ffc21b; --brand-strong: #f2a800; --brand-ink: #6b3d12; --crit: #e03131;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
        font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 20px;
        background-image:
          radial-gradient(circle at 12% 12%, rgba(255,194,27,.16), transparent 32%),
          radial-gradient(circle at 88% 8%, rgba(34,164,221,.08), transparent 26%);
      }
      .card {
        width: 100%; max-width: 380px; background: var(--panel);
        border: 1px solid var(--border); border-radius: 22px; padding: 34px 28px;
        box-shadow: 0 16px 40px rgba(107,61,18,.12); text-align: center;
      }
      .logo {
        width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 16px;
        background: linear-gradient(145deg, var(--brand), var(--brand-strong));
        display: flex; align-items: center; justify-content: center; font-size: 32px;
        box-shadow: 0 6px 16px rgba(242,168,0,.4);
      }
      h1 { font-family: "Baloo 2", sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--heading); margin: 0; }
      p.sub { color: var(--dim); font-size: 13px; font-weight: 600; margin: 4px 0 22px; }
      label { display: block; text-align: left; font-size: 12.5px; font-weight: 700; color: var(--dim); margin-bottom: 8px; }
      input {
        width: 100%; padding: 14px 16px; font-size: 20px; letter-spacing: 6px; text-align: center;
        border: 2px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--text);
        font-family: "Nunito", sans-serif; font-weight: 800;
      }
      input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px #fff2cc; }
      button {
        width: 100%; margin-top: 16px; padding: 14px; font-size: 15px; font-weight: 800;
        border: none; border-radius: 14px; cursor: pointer;
        background: linear-gradient(145deg, var(--brand), var(--brand-strong)); color: var(--brand-ink);
        font-family: "Nunito", sans-serif;
      }
      button:hover { box-shadow: 0 6px 16px rgba(242,168,0,.4); }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .err { color: var(--crit); font-size: 13px; font-weight: 700; margin-top: 12px; min-height: 18px; }
    </style>
  </head>
  <body>
    <form class="card" id="form">
      <div class="logo">🛡️</div>
      <h1>STRIIS</h1>
      <p class="sub">Digite o PIN de acesso</p>
      <label for="pin">PIN</label>
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" autofocus placeholder="••••••" />
      <button type="submit" id="btn">Entrar</button>
      <div class="err" id="err"></div>
    </form>
    <script>
      const form = document.getElementById('form');
      const pin = document.getElementById('pin');
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        btn.disabled = true;
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ pin: pin.value }),
          });
          if (res.ok) {
            window.location.href = '/';
          } else {
            const d = await res.json().catch(() => ({}));
            err.textContent = d.error || 'PIN incorreto.';
            pin.value = '';
            pin.focus();
          }
        } catch (e2) {
          err.textContent = 'Erro de conexão. Tente de novo.';
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
