<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>STRIIS — Acesso</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffc21b" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="STRIIS" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fbf6ec; --panel: #fff; --border: #ece0c9;
        --text: #3c3122; --dim: #90805f; --heading: #6b3d12;
        --brand: #ffc21b; --brand-strong: #f2a800; --brand-ink: #6b3d12;
        --green: #3fae5a; --crit: #e03131;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
        font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 20px;
        background-image:
          radial-gradient(circle at 12% 12%, rgba(255,194,27,.18), transparent 34%),
          radial-gradient(circle at 88% 8%, rgba(34,164,221,.08), transparent 28%),
          radial-gradient(circle at 75% 92%, rgba(255,194,27,.12), transparent 36%);
      }
      .card {
        width: 100%; max-width: 400px; background: var(--panel);
        border: 1px solid var(--border); border-radius: 26px; padding: 38px 30px;
        box-shadow: 0 20px 50px rgba(107,61,18,.14); text-align: center;
        animation: rise .4s ease;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .logo {
        width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 20px;
        background: linear-gradient(145deg, var(--brand), var(--brand-strong));
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 22px rgba(242,168,0,.45);
      }
      .logo svg { width: 42px; height: 42px; }
      h1 { font-family: "Baloo 2", sans-serif; font-size: 27px; letter-spacing: 2px; color: var(--heading); margin: 0; }
      p.sub { color: var(--dim); font-size: 13.5px; font-weight: 700; margin: 6px 0 26px; }
      .pins { display: flex; gap: 9px; justify-content: center; margin-bottom: 6px; }
      .pins.shake { animation: shake .4s; }
      @keyframes shake { 0%,100%{transform:none} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
      .pins input {
        width: 46px; height: 56px; text-align: center; font-size: 24px; font-weight: 800;
        border: 2px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--heading);
        font-family: "Nunito", sans-serif; -webkit-text-security: disc; caret-color: var(--brand-strong);
      }
      .pins input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px #fff2cc; transform: translateY(-1px); }
      .pins input.filled { border-color: var(--brand-strong); background: #fffaf0; }
      button {
        width: 100%; margin-top: 20px; padding: 15px; font-size: 15.5px; font-weight: 800;
        border: none; border-radius: 15px; cursor: pointer; color: var(--brand-ink);
        background: linear-gradient(145deg, var(--brand), var(--brand-strong));
        font-family: "Nunito", sans-serif; transition: box-shadow .15s, transform .1s;
      }
      button:hover { box-shadow: 0 8px 20px rgba(242,168,0,.45); }
      button:active { transform: translateY(1px); }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .err { color: var(--crit); font-size: 13px; font-weight: 800; margin-top: 14px; min-height: 18px; }
      .foot { margin-top: 18px; font-size: 11.5px; color: var(--dim); font-weight: 600; }
    </style>
  </head>
  <body>
    <form class="card" id="form" autocomplete="off">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L20 5 V11 C20 16.2 16.6 20.1 12 22 C7.4 20.1 4 16.2 4 11 V5 Z" fill="#fff" stroke="#6b3d12" stroke-width="1" />
          <path d="M8.3 12.2 l2.6 2.6 L15.9 9.2" stroke="#3fae5a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>STRIIS</h1>
      <p class="sub">Digite o PIN de acesso</p>
      <div class="pins" id="pins">
        <input inputmode="numeric" maxlength="1" aria-label="dígito 1" />
        <input inputmode="numeric" maxlength="1" aria-label="dígito 2" />
        <input inputmode="numeric" maxlength="1" aria-label="dígito 3" />
        <input inputmode="numeric" maxlength="1" aria-label="dígito 4" />
        <input inputmode="numeric" maxlength="1" aria-label="dígito 5" />
        <input inputmode="numeric" maxlength="1" aria-label="dígito 6" />
      </div>
      <button type="submit" id="btn">Entrar 🔓</button>
      <div class="err" id="err"></div>
      <div class="foot">🔒 Acesso protegido · STRIIS</div>
    </form>
    <script>
      const form = document.getElementById('form');
      const pins = [...document.querySelectorAll('#pins input')];
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const box = document.getElementById('pins');

      pins[0].focus();
      const getPin = () => pins.map((i) => i.value).join('');

      pins.forEach((inp, idx) => {
        inp.addEventListener('input', () => {
          inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
          inp.classList.toggle('filled', !!inp.value);
          if (inp.value && idx < pins.length - 1) pins[idx + 1].focus();
          if (getPin().length === pins.length) submit();
        });
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !inp.value && idx > 0) pins[idx - 1].focus();
        });
        inp.addEventListener('paste', (e) => {
          e.preventDefault();
          const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, pins.length);
          digits.split('').forEach((d, i) => { if (pins[i]) { pins[i].value = d; pins[i].classList.add('filled'); } });
          (pins[digits.length] || pins[pins.length - 1]).focus();
          if (getPin().length === pins.length) submit();
        });
      });

      let sending = false;
      async function submit() {
        if (sending) return;
        const pin = getPin();
        if (pin.length < pins.length) { err.textContent = 'Digite os 6 dígitos.'; return; }
        sending = true; btn.disabled = true; err.textContent = '';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ pin }),
          });
          if (res.ok) { window.location.href = '/'; return; }
          const d = await res.json().catch(() => ({}));
          err.textContent = d.error || 'PIN incorreto.';
          box.classList.add('shake');
          setTimeout(() => box.classList.remove('shake'), 450);
          pins.forEach((i) => { i.value = ''; i.classList.remove('filled'); });
          pins[0].focus();
        } catch (e2) {
          err.textContent = 'Erro de conexão. Tente de novo.';
        } finally {
          sending = false; btn.disabled = false;
        }
      }
      form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
